apiVersion: apps/v1
kind: Deployment
metadata:
  name: duster-client
  labels:
    app: duster-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duster-client
  template:
    metadata:
      labels:
        app: duster-client
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: duster-client
          image: stevetosak/authos-duster:latest
          ports:
            - name: http
              containerPort: 8785
          envFrom:
            - configMapRef:
                name: duster-config
            - secretRef:
                name: duster-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness must not depend on Redis — /health/live is process-only.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          # Readiness pings Redis — a Redis outage pulls the pod from the Service but never restarts it.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
