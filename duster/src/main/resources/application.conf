ktor {
  application {
    modules = [ com.example.ApplicationKt.main ]
  }
  development = true
}
redis {
  host = "localhost"
  port = 6379
  password = ${?REDIS_PASSWORD}
  useSSL = false
  timeout = 60
}
authos {
  # Override with AUTHOS_BASE_URL env var (recommended for non-local deployments)
  baseUrl = "http://localhost:8080"
}