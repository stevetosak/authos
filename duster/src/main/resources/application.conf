ktor {
  application {
    modules = [ com.authos.ApplicationKt.main ]
  }
  development = true
}
redis {
  # REDIS_URL wins over the discrete fields when set: redis[s]://[:password@]host:port[/db]
  url = ${?REDIS_URL}
  host = "localhost"
  port = 6379
  password = ${?REDIS_PASSWORD}
  useSSL = false
  timeout = 60
}
authos {
  # Override with AUTHOS_BASE_URL env var (recommended for non-local deployments)
  baseUrl = "http://localhost:8080"
}
