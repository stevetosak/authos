# Production compose — no bundled Redis. All config via environment or a .env file.
#
# Required:
#   AUTHOS_BASE_URL     base URL of your Authos IDP — must byte-match its discovery `issuer`
#   DUSTER_ADMIN_TOKEN  guards /duster/api/v1/internal/*  (openssl rand -hex 32)
#   REDIS_URL  OR  REDIS_HOST
#
# Optional:
#   PORT (default 8785), REDIS_PORT, REDIS_PASSWORD, REDIS_USESSL, REDIS_TIMEOUT, HOST_IP
services:
  duster-client:
    image: "stevetosak/authos-duster:latest"
    ports:
      - "${PORT:-8785}:${PORT:-8785}"
    environment:
      AUTHOS_BASE_URL: ${AUTHOS_BASE_URL}
      DUSTER_ADMIN_TOKEN: ${DUSTER_ADMIN_TOKEN}
      PORT: ${PORT:-8785}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USESSL: ${REDIS_USESSL:-false}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-60}
      HOST_IP: ${HOST_IP:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-8785}/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [duster-net]

networks:
  duster-net:
    driver: bridge
