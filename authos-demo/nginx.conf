server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never cache the runtime config or the entry document; hashed assets are immutable.
  location = /config/config.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /index.html       { add_header Cache-Control "no-store"; }
  location /assets/            { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # SPA fallback. `/duster/*` never reaches this container — the ingress path-routes it to the
  # in-cluster Duster Service first.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
