apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace-agnostic base. An overlay supplies the namespace, the image tag, and the
# `authos-demo-config` ConfigMap the Deployment reads via envFrom (at minimum
# DEMO_DUSTER_CLIENT_ID). The Ingress path-routes `/duster` to the in-cluster Duster
# Service, so the demo must run in a namespace that can resolve it (co-locate with Duster).
# See overlays/example for a complete set.

resources:
  - deployment.yml
  - service.yml
  - ingress.yml

labels:
  - pairs:
      app.kubernetes.io/name: authos-demo
      app.kubernetes.io/component: demo
    includeSelectors: false
