name: sdk

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/sdk.yaml"

concurrency:
  group: sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run sync-license -- --check
      - run: npm pack -w @authoss/duster-core -w @authoss/duster-react -w @authoss/duster-vue -w @authoss/duster-angular

      # sdk-release.yaml only fires on tags, so sanity-check its version stamper here.
      - name: Release version stamper
        run: |
          node scripts/set-release-version.mjs 9.9.9-citest
          node -e "const d=require('./react/package.json').dependencies['@authoss/duster-core']; if(d!=='^9.9.9-citest'){console.error('core dep not pinned:',d);process.exit(1)}"
          git checkout -- core react vue angular

  browser-e2e:
    # The real @authoss/duster-react package, consumed by a real Vite SPA, driven through
    # login -> silent refresh -> logout against the e2e-tests docker-compose stack. Closes the
    # Phase 1 exit criterion (docs/duster-v1-tasks.md).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sdk-e2e-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: sdk-e2e-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/package-lock.json

      # authos-api jar (mvnw package) + duster fat jar + the throwaway keystore the compose
      # stack bind-mounts.
      - name: Build stack artifacts
        run: ./gradlew --no-daemon :duster:buildFatJar :e2e-tests:buildAuthosApiJar :e2e-tests:generateTestKeystore

      - name: Build the SDK packages
        working-directory: packages
        run: |
          npm ci
          npm run build

      - name: Install Playwright (chromium)
        working-directory: packages/e2e
        run: npx playwright install --with-deps chromium

      - name: Bring up the compose stack
        run: docker compose -p authos-sdk-e2e -f e2e-tests/docker-compose.e2e.yml up -d

      - name: Run browser e2e
        working-directory: packages
        run: npm run e2e

      - name: Stack logs
        if: always()
        run: docker compose -p authos-sdk-e2e -f e2e-tests/docker-compose.e2e.yml logs --no-color --timestamps || true

      - name: Tear down the stack
        if: always()
        run: docker compose -p authos-sdk-e2e -f e2e-tests/docker-compose.e2e.yml down -v --remove-orphans || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-browser-e2e-report
          path: packages/e2e/playwright-report/**
          if-no-files-found: ignore
