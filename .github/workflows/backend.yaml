name: Build & Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "authos-api/**"
      - ".github/workflows/backend.yaml"

env:
  IMAGE_VERSION_PATTERN: "alpha-${{ github.sha }}"
  DOCKERHUB_NAMESPACE: "stevetosak"

jobs:
  # Gate: the deploy only proceeds if the full e2e stack suite is green.
  e2e:
    uses: ./.github/workflows/e2e.yaml

  backend-build-push:
    needs: e2e
    runs-on: ubuntu-22.04
    outputs:
      IMAGE_LATEST: ${{ steps.backend_image_tags.outputs.IMAGE_LATEST }}
      IMAGE_VERSION: ${{ steps.backend_image_tags.outputs.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('authos-api/**/pom.xml') }}

      - name: Build Spring Boot App
        working-directory: ./authos-api
        run: mvn -q clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set API image tags
        id: backend_image_tags
        run: |
          IMAGE_LATEST="${{ env.DOCKERHUB_NAMESPACE }}/authos-api:latest"
          IMAGE_VERSION="${{ env.DOCKERHUB_NAMESPACE }}/authos-api:${{ env.IMAGE_VERSION_PATTERN }}"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./authos-api
          push: true
          tags: |
            ${{steps.backend_image_tags.outputs.IMAGE_LATEST}}
            ${{steps.backend_image_tags.outputs.IMAGE_VERSION}}

  # The tag bump goes to the infra repo as a pull request that only its
  # required check `deploy-scope` can let merge (infra ADR 0010, Amendment
  # 2026-10-22). One group per Application, so two bumps never race.
  deploy-backend:
    needs: backend-build-push
    runs-on: ubuntu-24.04
    concurrency:
      group: tag-bump-authos-api
      cancel-in-progress: false
    steps:
      - uses: stevetosak/hetzner-cloud-infra/.github/actions/tag-bump@master
        with:
          private-key: ${{ secrets.TAG_BUMP_APP_KEY }}
          overlay-dir: projects/authos/api/manifests/overlays/dev
          image: stevetosak/authos-api
          tag: ${{ env.IMAGE_VERSION_PATTERN }}
