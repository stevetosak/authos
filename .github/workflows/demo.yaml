name: Build & Deploy Demo

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "authos-demo/**"
      - ".github/workflows/demo.yaml"

env:
  IMAGE_VERSION_PATTERN: "alpha-${{ github.sha }}"
  DOCKERHUB_NAMESPACE: "stevetosak"

jobs:
  # Gate: nothing ships from master unless the full e2e stack suite is green.
  e2e:
    uses: ./.github/workflows/e2e.yaml

  demo-build-push:
    needs: e2e
    runs-on: ubuntu-22.04
    outputs:
      IMAGE_LATEST: ${{ steps.demo_image_tags.outputs.IMAGE_LATEST }}
      IMAGE_VERSION: ${{ steps.demo_image_tags.outputs.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('authos-demo/package-lock.json') }}

      # Resolves @authoss/duster-react from npm and produces dist/ — the image only serves it.
      - name: Build demo SPA
        working-directory: ./authos-demo
        run: |
          npm ci
          npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set Demo image tags
        id: demo_image_tags
        run: |
          IMAGE_LATEST="${{ env.DOCKERHUB_NAMESPACE }}/authos-demo:latest"
          IMAGE_VERSION="${{ env.DOCKERHUB_NAMESPACE }}/authos-demo:${{ env.IMAGE_VERSION_PATTERN }}"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./authos-demo
          push: true
          tags: |
            ${{ steps.demo_image_tags.outputs.IMAGE_LATEST }}
            ${{ steps.demo_image_tags.outputs.IMAGE_VERSION }}

  deploy-demo:
    needs: demo-build-push
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2.1.0

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: 'stevetosak/${{ vars.INFRA_REPO_NAME }}'
          token: '${{ secrets.INFRA_REPO_TOKEN }}'
          path: '${{ vars.INFRA_REPO_NAME }}'

      - name: Update Overlay
        run: |
          cd ${{ vars.INFRA_REPO_NAME }}/${{ vars.INFRA_REPO_DEMO_OVERLAY_DIR }}
          kustomize edit set image ${{ needs.demo-build-push.outputs.IMAGE_VERSION }}

      - name: Commit and Push Changes
        run: |
          cd ${{ vars.INFRA_REPO_NAME }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update Demo image"
          git push origin HEAD
