name: Build & Deploy Demo

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "authos-demo/**"
      - ".github/workflows/demo.yaml"

env:
  IMAGE_VERSION_PATTERN: "alpha-${{ github.sha }}"
  DOCKERHUB_NAMESPACE: "stevetosak"

jobs:
  # Gate: nothing ships from master unless the full e2e stack suite is green.
  e2e:
    uses: ./.github/workflows/e2e.yaml

  demo-build-push:
    needs: e2e
    runs-on: ubuntu-22.04
    outputs:
      IMAGE_LATEST: ${{ steps.demo_image_tags.outputs.IMAGE_LATEST }}
      IMAGE_VERSION: ${{ steps.demo_image_tags.outputs.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('authos-demo/package-lock.json') }}

      # Resolves @authoss/duster-react from npm and produces dist/ — the image only serves it.
      - name: Build demo SPA
        working-directory: ./authos-demo
        run: |
          npm ci
          npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set Demo image tags
        id: demo_image_tags
        run: |
          IMAGE_LATEST="${{ env.DOCKERHUB_NAMESPACE }}/authos-demo:latest"
          IMAGE_VERSION="${{ env.DOCKERHUB_NAMESPACE }}/authos-demo:${{ env.IMAGE_VERSION_PATTERN }}"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./authos-demo
          push: true
          tags: |
            ${{ steps.demo_image_tags.outputs.IMAGE_LATEST }}
            ${{ steps.demo_image_tags.outputs.IMAGE_VERSION }}

  # The tag bump goes to the infra repo as a pull request that only its
  # required check `deploy-scope` can let merge (infra ADR 0010, Amendment
  # 2026-10-22). One group per Application, so two bumps never race.
  deploy-demo:
    needs: demo-build-push
    runs-on: ubuntu-24.04
    concurrency:
      group: tag-bump-authos-demo
      cancel-in-progress: false
    steps:
      - uses: stevetosak/hetzner-cloud-infra/.github/actions/tag-bump@master
        with:
          private-key: ${{ secrets.TAG_BUMP_APP_KEY }}
          overlay-dir: projects/authos/demo/manifests/overlays/dev
          image: stevetosak/authos-demo
          tag: ${{ env.IMAGE_VERSION_PATTERN }}
