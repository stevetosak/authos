name: Build & Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "authos-frontend/**"
      - ".github/workflows/frontend.yaml"

env:
  IMAGE_VERSION_PATTERN: "alpha-${{ github.sha }}"
  DOCKERHUB_NAMESPACE: "stevetosak"

jobs:
  # Gate: the deploy only proceeds if the full e2e stack suite is green.
  e2e:
    uses: ./.github/workflows/e2e.yaml

  frontend-build-push:
    needs: e2e
    runs-on: ubuntu-22.04
    outputs:
      IMAGE_LATEST: ${{ steps.frontend_image_tags.outputs.IMAGE_LATEST }}
      IMAGE_VERSION: ${{ steps.frontend_image_tags.outputs.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('authos-frontend/**/package-lock.json') }}

      - name: Build React frontend
        working-directory: ./authos-frontend
        run: |
          npm ci
          npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set Frontend image tags
        id: frontend_image_tags
        run: |
          IMAGE_LATEST="${{ env.DOCKERHUB_NAMESPACE }}/authos-ui:latest"
          IMAGE_VERSION="${{ env.DOCKERHUB_NAMESPACE }}/authos-ui:${{ env.IMAGE_VERSION_PATTERN }}"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./authos-frontend
          push: true
          tags: |
            ${{steps.frontend_image_tags.outputs.IMAGE_LATEST}}
            ${{steps.frontend_image_tags.outputs.IMAGE_VERSION}}

  # The tag bump goes to the infra repo as a pull request that only its
  # required check `deploy-scope` can let merge (infra ADR 0010, Amendment
  # 2026-10-22). One group per Application, so two bumps never race.
  deploy-frontend:
    needs: frontend-build-push
    runs-on: ubuntu-24.04
    concurrency:
      group: tag-bump-authos-ui
      cancel-in-progress: false
    steps:
      - uses: stevetosak/hetzner-cloud-infra/.github/actions/tag-bump@master
        with:
          private-key: ${{ secrets.TAG_BUMP_APP_KEY }}
          overlay-dir: projects/authos/ui/manifests/overlays/dev
          image: stevetosak/authos-ui
          tag: ${{ env.IMAGE_VERSION_PATTERN }}
