name: Build & Deploy Duster

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "duster/**"
      - ".github/workflows/duster.yaml"

env:
  IMAGE_VERSION_PATTERN: "alpha-${{ github.sha }}"
  DOCKERHUB_NAMESPACE: "stevetosak"

jobs:
  # Gate: the deploy only proceeds if the full e2e stack suite is green.
  e2e:
    uses: ./.github/workflows/e2e.yaml

  duster-build-push:
    needs: e2e
    runs-on: ubuntu-22.04
    outputs:
      IMAGE_LATEST: ${{ steps.duster_image_tags.outputs.IMAGE_LATEST }}
      IMAGE_VERSION: ${{ steps.duster_image_tags.outputs.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set Duster image tags
        id: duster_image_tags
        run: |
          IMAGE_LATEST="${{ env.DOCKERHUB_NAMESPACE }}/authos-duster:latest"
          IMAGE_VERSION="${{ env.DOCKERHUB_NAMESPACE }}/authos-duster:${{ env.IMAGE_VERSION_PATTERN }}"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_OUTPUT

      # The Dockerfile is a multi-stage Gradle build — it produces the fat jar itself,
      # so there is no host-side Java/Gradle step (unlike backend.yaml).
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./duster
          push: true
          tags: |
            ${{ steps.duster_image_tags.outputs.IMAGE_LATEST }}
            ${{ steps.duster_image_tags.outputs.IMAGE_VERSION }}

  # The tag bump goes to the infra repo as a pull request that only its
  # required check `deploy-scope` can let merge (infra ADR 0010, Amendment
  # 2026-10-22). One group per Application, so two bumps never race.
  deploy-duster:
    needs: duster-build-push
    runs-on: ubuntu-24.04
    concurrency:
      group: tag-bump-authos-duster
      cancel-in-progress: false
    steps:
      - uses: stevetosak/hetzner-cloud-infra/.github/actions/tag-bump@master
        with:
          private-key: ${{ secrets.TAG_BUMP_APP_KEY }}
          overlay-dir: projects/authos/duster/manifests/overlays/dev
          image: stevetosak/authos-duster
          tag: ${{ env.IMAGE_VERSION_PATTERN }}
