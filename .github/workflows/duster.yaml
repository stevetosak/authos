name: Build & Deploy Duster

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "duster/**"
      - ".github/workflows/duster.yaml"

env:
  IMAGE_VERSION_PATTERN: "alpha-${{ github.sha }}"
  DOCKERHUB_NAMESPACE: "stevetosak"

jobs:
  # Gate: the deploy only proceeds if the full e2e stack suite is green.
  e2e:
    uses: ./.github/workflows/e2e.yaml

  duster-build-push:
    needs: e2e
    runs-on: ubuntu-22.04
    outputs:
      IMAGE_LATEST: ${{ steps.duster_image_tags.outputs.IMAGE_LATEST }}
      IMAGE_VERSION: ${{ steps.duster_image_tags.outputs.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set Duster image tags
        id: duster_image_tags
        run: |
          IMAGE_LATEST="${{ env.DOCKERHUB_NAMESPACE }}/authos-duster:latest"
          IMAGE_VERSION="${{ env.DOCKERHUB_NAMESPACE }}/authos-duster:${{ env.IMAGE_VERSION_PATTERN }}"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_OUTPUT

      # The Dockerfile is a multi-stage Gradle build — it produces the fat jar itself,
      # so there is no host-side Java/Gradle step (unlike backend.yaml).
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./duster
          push: true
          tags: |
            ${{ steps.duster_image_tags.outputs.IMAGE_LATEST }}
            ${{ steps.duster_image_tags.outputs.IMAGE_VERSION }}

  deploy-duster:
    needs: duster-build-push
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2.1.0

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: 'stevetosak/${{ vars.INFRA_REPO_NAME }}'
          token: '${{ secrets.INFRA_REPO_TOKEN }}'
          path: '${{ vars.INFRA_REPO_NAME }}'

      - name: Update Overlay
        run: |
          cd ${{ vars.INFRA_REPO_NAME }}/${{ vars.INFRA_REPO_DUSTER_OVERLAY_DIR }}
          kustomize edit set image ${{ needs.duster-build-push.outputs.IMAGE_VERSION }}

      - name: Commit and Push Changes
        run: |
          cd ${{ vars.INFRA_REPO_NAME }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update Duster image"
          git push origin HEAD
