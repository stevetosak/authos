name: docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - ".github/scripts/doc-size.sh"
      - ".github/workflows/docs.yaml"

jobs:
  size:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Fails the PR if a tracking doc is over its line limit. The fix is to
      # archive the stale section (docs/README.md § Archiving), not to bump the
      # limit in .github/scripts/doc-size.sh.
      - name: Check doc sizes
        run: ./.github/scripts/doc-size.sh
